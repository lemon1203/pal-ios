name: Build SDLPAL iOS (with cheats)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 鍙栨湰浠撳簱锛堣ˉ涓佽剼鏈級
        uses: actions/checkout@v4
        with:
          path: patcher

      - name: 鍙?SDLPAL 婧愮爜锛堝惈瀛愭ā鍧楋級
        uses: actions/checkout@v4
        with:
          repository: sdlpal/sdlpal
          ref: master
          submodules: recursive
          fetch-depth: 1
          path: sdlpal

      - name: 鎵撻噾鎵嬫寚琛ヤ竵
        run: |
          python3 patcher/apply_cheats.py sdlpal
          echo "---- 楠岃瘉琛ヤ竵 ----"
          grep -n "CHEAT_WORD_BASE" sdlpal/ui.h | head -3
          grep -n "PAL_CheatMenu" sdlpal/uigame.c | head -3
          grep -n "g_fCheatWalkThrough" sdlpal/map.c | head -3
          grep -n "g_fCheatNoEncounter" sdlpal/battle.c | head -3

      - name: 鎵撴憞鏉嗚Е灞忚ˉ涓?        run: |
          python3 patcher/apply_touch.py sdlpal
          python3 patcher/apply_touch_screen.py sdlpal
          echo "---- 楠岃瘉瑙﹀睆琛ヤ竵 ----"
          grep -n "PAL_JSHandleEvent" sdlpal/input.c | head -3
          grep -n "PAL_JS_DrawOnScreen" sdlpal/video.c | head -3
          grep -n "PAL_GetTouchLayout" sdlpal/input.h | head -3

      - name: 鏄剧ず宸ュ叿閾剧増鏈?        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 瀹夎 CocoaPods 渚濊禆
        working-directory: sdlpal/ios/SDLPal
        run: |
          pod --version || gem install cocoapods --no-document
          pod install --repo-update

      - name: 缂栬瘧 (鏃犵鍚? arm64)
        working-directory: sdlpal/ios/SDLPal
        run: |
          set -o pipefail
          xcodebuild \
            -workspace SDLPal.xcworkspace \
            -scheme SDLPal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log

      - name: 鎵撳寘鎴?ipa
        run: |
          APP_PATH=$(find sdlpal/ios/SDLPal/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "娌℃壘鍒?.app锛屾瀯寤哄け璐?; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SDLPAL-CHEAT.ipa Payload
          ls -lh SDLPAL-CHEAT.ipa

      - name: 涓婁紶浜х墿
        uses: actions/upload-artifact@v4
        with:
          name: SDLPAL-CHEAT-ipa
          path: SDLPAL-CHEAT.ipa
          retention-days: 30

      - name: 澶辫触鏃朵笂浼犳棩蹇?        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: sdlpal/ios/SDLPal/build.log
          retention-days: 7
